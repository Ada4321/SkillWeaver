# Keep the SkillWeaver-NIS submodule at the latest commit of Ada4321/SkillWeaver-NIS main.
# Triggered by SkillWeaver-NIS on every push (repository_dispatch), every 6 hours as a fallback,
# by hand, and when this workflow changes.
name: Sync SkillWeaver-NIS submodule

on:
  repository_dispatch:
    types: [nis-updated]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/sync-nis-submodule.yml]

permissions:
  contents: write

concurrency:
  group: sync-nis-submodule

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Point the submodule at SkillWeaver-NIS main and commit
        run: |
          git submodule update --remote SkillWeaver-NIS
          if git diff --quiet; then
            echo "SkillWeaver-NIS submodule is up to date."
            exit 0
          fi
          sha=$(git -C SkillWeaver-NIS rev-parse --short HEAD)
          subject=$(git -C SkillWeaver-NIS log -1 --format=%s)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Bump SkillWeaver-NIS to ${sha}" -m "SkillWeaver-NIS: ${subject}"
          git push
